name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Initialize example EmDash site
        run: npm run example:init

      - name: Start example EmDash site
        run: |
          cd example && ASTRO_TELEMETRY_DISABLED=1 npx astro dev --host 127.0.0.1 --port 4321 --background
          until curl -s http://127.0.0.1:4321 > /dev/null; do
            echo "Waiting for EmDash dev server..."
            sleep 1
          done
          echo "EmDash dev server is ready!"

      - name: Run tests (Unit, CLI, Live E2E)
        run: npm test

      - name: Stop example EmDash site
        if: always()
        run: cd example && npx astro dev stop || true
