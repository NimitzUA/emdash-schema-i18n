name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm to support staged publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Initialize example EmDash site
        run: npm run example:init

      - name: Start example EmDash site
        run: |
          cd example && ASTRO_TELEMETRY_DISABLED=1 npx astro dev --host 127.0.0.1 --port 4321 --background
          until curl -s http://127.0.0.1:4321 > /dev/null; do
            echo "Waiting for EmDash dev server..."
            sleep 1
          done
          echo "EmDash dev server is ready!"

      - name: Run test suite
        run: npm test

      - name: Stop example EmDash site
        if: always()
        run: cd example && npx astro dev stop || true

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Stage package on npm (Dry Run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run

      - name: Stage package on npm
        if: ${{ !inputs.dry_run }}
        run: npm stage publish

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
